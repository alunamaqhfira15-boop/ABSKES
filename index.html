<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Lounge - Ambient & Lofi Player</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Canvas Partikel Background */
    #visualizerCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Glassmorphic Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .title-section {
      text-align: center;
      margin-bottom: 20px;
      grid-column: 1 / -1;
    }

    .title-section h1 {
      font-size: 2.2rem;
      background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .title-section p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Pomodoro Timer */
    .timer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 700;
      margin: 15px 0;
      font-family: monospace;
      color: var(--accent-cyan);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .timer-status {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-pink);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn:hover {
      background: var(--accent-purple);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(192, 132, 252, 0.4);
    }

    .btn-active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    }

    /* Ambient Sound Mixer */
    .ambient-card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--accent-purple);
    }

    .sound-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 15px;
      border-radius: 14px;
    }

    .sound-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    .slider {
      width: 100px;
      accent-color: var(--accent-purple);
      cursor: pointer;
    }

    /* Music Player Simple */
    .player-card {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .track-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .play-master-btn {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4);
      transition: transform 0.2s;
    }

    .play-master-btn:hover {
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <!-- Background Visualizer Canvas -->
  <canvas id="visualizerCanvas"></canvas>

  <div class="app-container">
    
    <!-- Title Section -->
    <div class="title-section">
      <h1>🎧 Study Lounge Aesthetic</h1>
      <p>Ruang musik & audio ambient penyemangat belajar untuk pelajar</p>
    </div>

    <!-- 1. Pomodoro Timer Card -->
    <div class="glass-card timer-card">
      <div class="timer-status" id="timerMode">Sesi Belajar</div>
      <div class="timer-display" id="timeDisplay">25:00</div>
      <div class="btn-group">
        <button class="btn btn-active" id="startTimerBtn" onclick="toggleTimer()">Mulai</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
        <button class="btn" onclick="switchMode()">Mode Istirahat</button>
      </div>
    </div>

    <!-- 2. Ambient Sound Mixer Card -->
    <div class="glass-card ambient-card">
      <h2>🌧️ Ambient Sound Mixer</h2>
      
      <!-- Hujan -->
      <div class="sound-item">
        <div class="sound-info">
          <span>🌧️ Suara Hujan</span>
        </div>
        <input type="range" class="slider" id="rainVol" min="0" max="100" value="0" oninput="updateAmbient('rain', this.value)">
      </div>

      <!-- Api Unggun -->
      <div class="sound-item">
        <div class="sound-info">
          <span>🔥 Api Unggun</span>
        </div>
        <input type="range" class="slider" id="fireVol" min="0" max="100" value="0" oninput="updateAmbient('fire', this.value)">
      </div>

      <!-- Suara Cafe -->
      <div class="sound-item">
        <div class="sound-info">
          <span>☕ Suara Kafe</span>
        </div>
        <input type="range" class="slider" id="cafeVol" min="0" max="100" value="0" oninput="updateAmbient('cafe', this.value)">
      </div>
    </div>

    <!-- 3. Bottom Master Controller Card -->
    <div class="glass-card player-card">
      <div class="track-info">
        <div class="track-icon">✨</div>
        <div>
          <h3 id="nowPlayingText">Siap Fokus Belajar</h3>
          <p style="color: var(--text-sub); font-size: 0.85rem;">Geser slider ambient di atas untuk memainkan suara</p>
        </div>
      </div>
      <button class="play-master-btn" id="masterPlayBtn" onclick="toggleMasterAudio()">▶</button>
    </div>

  </div>

  <script>
    /* ==========================================
       1. WEB AUDIO API SYNTHESIZER (TANPA FILE MP3)
       ========================================== */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    // Nodes untuk Suara
    let rainNode = null, rainGain = null;
    let fireNode = null, fireGain = null;
    let isMasterPlaying = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Generator White Noise untuk Hujan
    function createRainSound() {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1000;

      rainGain = audioCtx.createGain();
      rainGain.gain.value = 0;

      noise.connect(filter);
      filter.connect(rainGain);
      rainGain.connect(audioCtx.destination);
      noise.start();
      return { noise, rainGain };
    }

    // Generator Pink Noise untuk Api Unggun
    function createFireSound() {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        let white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        data[i] *= 0.11;
        b6 = white * 0.115926;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      fireGain = audioCtx.createGain();
      fireGain.gain.value = 0;

      noise.connect(fireGain);
      fireGain.connect(audioCtx.destination);
      noise.start();
      return { noise, fireGain };
    }

    function updateAmbient(type, val) {
      initAudio();
      const volume = val / 100;

      if (type === 'rain') {
        if (!rainNode) rainNode = createRainSound();
        rainGain.gain.setTargetAtTime(volume * 0.5, audioCtx.currentTime, 0.1);
      } else if (type === 'fire') {
        if (!fireNode) fireNode = createFireSound();
        fireGain.gain.setTargetAtTime(volume * 0.4, audioCtx.currentTime, 0.1);
      }

      updateMasterState();
    }

    function updateMasterState() {
      const rainVal = document.getElementById('rainVol').value;
      const fireVal = document.getElementById('fireVol').value;
      const cafeVal = document.getElementById('cafeVol').value;

      if (rainVal > 0 || fireVal > 0 || cafeVal > 0) {
        isMasterPlaying = true;
        document.getElementById('masterPlayBtn').innerText = '⏸';
        document.getElementById('nowPlayingText').innerText = 'Memutar Suara Ambient';
      } else {
        isMasterPlaying = false;
        document.getElementById('masterPlayBtn').innerText = '▶';
        document.getElementById('nowPlayingText').innerText = 'Siap Fokus Belajar';
      }
    }

    function toggleMasterAudio() {
      initAudio();
      if (isMasterPlaying) {
        // Mute All
        if (rainGain) rainGain.gain.value = 0;
        if (fireGain) fireGain.gain.value = 0;
        document.getElementById('rainVol').value = 0;
        document.getElementById('fireVol').value = 0;
        document.getElementById('cafeVol').value = 0;
        updateMasterState();
      } else {
        // Play default rain
        document.getElementById('rainVol').value = 50;
        updateAmbient('rain', 50);
      }
    }

    /* ==========================================
       2. POMODORO TIMER LOGIC
       ========================================== */
    let timerSeconds = 25 * 60;
    let isTimerRunning = false;
    let timerInterval = null;
    let isStudyMode = true;

    const timeDisplay = document.getElementById('timeDisplay');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const timerModeText = document.getElementById('timerMode');

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        startTimerBtn.innerText = 'Lanjut';
      } else {
        isTimerRunning = true;
        startTimerBtn.innerText = 'Jeda';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            playNotificationSound();
            alert(isStudyMode ? 'Waktu belajar selesai! Sesi istirahat dimulai.' : 'Waktu istirahat selesai! Kembali belajar!');
            switchMode();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = isStudyMode ? 25 * 60 : 5 * 60;
      startTimerBtn.innerText = 'Mulai';
      updateTimerDisplay();
    }

    function switchMode() {
      isStudyMode = !isStudyMode;
      timerModeText.innerText = isStudyMode ? 'Sesi Belajar' : 'Sesi Istirahat';
      timerModeText.style.color = isStudyMode ? 'var(--accent-pink)' : 'var(--accent-cyan)';
      resetTimer();
    }

    function playNotificationSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Note D5
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    /* ==========================================
       3. BACKGROUND PARTICLE CANVAS VISUALIZER
       ========================================== */
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * -0.5 - 0.2;
        this.opacity = Math.random() * 0.5 + 0.2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.fillStyle = `rgba(192, 132, 252, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 50; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
