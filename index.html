<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Lounge - Music Genre, Timer & Notes</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --accent-cyan: #38bdf8;
      --accent-yellow: #facc15;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .title-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .title-section h1 {
      font-size: 2rem;
      background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .title-section p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    /* Timer Styles */
    .timer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: 3.2rem;
      font-weight: 700;
      margin: 10px 0;
      font-family: monospace;
      color: var(--accent-cyan);
    }

    .timer-settings {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .timer-settings input {
      width: 70px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(0,0,0,0.3);
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-purple);
    }

    .btn-active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    }

    /* Music Player Styles */
    .music-card h2, .notes-card h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--accent-purple);
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* Scrollbar Kustom */
    .track-list::-webkit-scrollbar {
      width: 6px;
    }
    .track-list::-webkit-scrollbar-thumb {
      background: var(--accent-purple);
      border-radius: 4px;
    }

    .track-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .track-item:hover {
      border-color: var(--accent-purple);
    }

    .track-item.playing {
      background: rgba(192, 132, 252, 0.25);
      border-color: var(--accent-pink);
    }

    .genre-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.15);
      color: var(--accent-yellow);
    }

    /* Notes Styles */
    .notes-card {
      grid-column: 1 / -1;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: white;
      resize: vertical;
      font-size: 0.95rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-purple);
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      color: var(--text-sub);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="title-section">
    <h1>🎧 Study Lounge Multi-Genre</h1>
    <p>Atur timer belajarmu, pilih genre musik favoritmu, dan catat materi penting!</p>
  </div>

  <div class="app-container">
    
    <!-- 1. POMODORO TIMER DENGAN CUSTOM WAKTU -->
    <div class="glass-card timer-card">
      <div style="font-size:0.9rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent-pink); font-weight:bold;" id="timerLabel">Sesi Fokus</div>
      
      <div class="timer-display" id="timeDisplay">25:00</div>

      <div class="timer-settings">
        <input type="number" id="customMinutes" value="25" min="1" max="120" title="Ubah Menit">
        <button class="btn" onclick="setCustomTimer()">Atur Waktu</button>
      </div>

      <div class="btn-group">
        <button class="btn btn-active" id="startTimerBtn" onclick="toggleTimer()">Mulai</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- 2. PEMUTAR LAGU DENGAN GENRE LENGKAP -->
    <div class="glass-card music-card">
      <h2>🎵 Pilihan Genre Musik</h2>
      <div class="track-list" id="trackList">
        <!-- List lagu akan diisi via JavaScript -->
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" id="playMusicBtn" onclick="togglePlayMusic()">▶ Putar Musik</button>
        <button class="btn" onclick="stopMusic()">⏹ Berhenti</button>
      </div>
    </div>

    <!-- 3. BUKU CATATAN SISWA (STUDY NOTES) -->
    <div class="glass-card notes-card">
      <h2>📝 Buku Catatan Tugas & Pelajaran</h2>
      <textarea id="studentNotes" placeholder="Tulis catatan, rangkuman, atau daftar tugas sekolahmu di sini..." oninput="saveNotes()"></textarea>
      <div class="note-footer">
        <span id="saveStatus">Tersimpan otomatis di browser</span>
        <button class="btn" onclick="clearNotes()" style="padding: 4px 10px; font-size: 0.8rem;">Hapus Catatan</button>
      </div>
    </div>

  </div>

  <script>
    /* ==========================================
       1. POMODORO TIMER LOGIC
       ========================================== */
    let timerSeconds = 25 * 60;
    let isRunning = false;
    let timerInterval = null;

    const timeDisplay = document.getElementById('timeDisplay');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const customMinutesInput = document.getElementById('customMinutes');

    function updateDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function setCustomTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startTimerBtn.innerText = 'Mulai';
      const userMins = parseInt(customMinutesInput.value);
      if (userMins > 0) {
        timerSeconds = userMins * 60;
        updateDisplay();
      }
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startTimerBtn.innerText = 'Lanjut';
      } else {
        isRunning = true;
        startTimerBtn.innerText = 'Jeda';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startTimerBtn.innerText = 'Mulai';
            alert('Waktu belajar selesai! Waktunya istirahat sejenak. 🎉');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startTimerBtn.innerText = 'Mulai';
      setCustomTimer();
    }

    /* ==========================================
       2. PLAYLIST DENGAN GENRE VARIASI LENGKAP
       ========================================== */
    const playlist = [
      { genre: "POP", title: "Upbeat Acoustic Pop", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { genre: "DANGDUT", title: "Santai Kendang Rhythm", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
      { genre: "HIP HOP", title: "Lo-Fi Boom Bap Beat", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
      { genre: "REGGAE", title: "Island Beach Vibe Reggae", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" },
      { genre: "ROCK", title: "Energetic Guitar Rock", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { genre: "KLASIK", title: "Mozart Calm Piano & Strings", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    ];

    let currentTrackIndex = 0;
    let audioElement = new Audio();
    audioElement.loop = true;
    let isMusicPlaying = false;

    const trackListEl = document.getElementById('trackList');
    const playMusicBtn = document.getElementById('playMusicBtn');

    function renderPlaylist() {
      trackListEl.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `track-item ${index === currentTrackIndex ? 'playing' : ''}`;
        item.innerHTML = `
          <span>🎵 ${track.title}</span>
          <span class="genre-badge">${track.genre}</span>
        `;
        item.onclick = () => selectTrack(index);
        trackListEl.appendChild(item);
      });
    }

    function selectTrack(index) {
      currentTrackIndex = index;
      audioElement.src = playlist[index].src;
      audioElement.play();
      isMusicPlaying = true;
      playMusicBtn.innerText = '⏸ Jeda Musik';
      renderPlaylist();
    }

    function togglePlayMusic() {
      if (!audioElement.src) {
        selectTrack(0);
        return;
      }
      if (isMusicPlaying) {
        audioElement.pause();
        isMusicPlaying = false;
        playMusicBtn.innerText = '▶ Putar Musik';
      } else {
        audioElement.play();
        isMusicPlaying = true;
        playMusicBtn.innerText = '⏸ Jeda Musik';
      }
    }

    function stopMusic() {
      audioElement.pause();
      audioElement.currentTime = 0;
      isMusicPlaying = false;
      playMusicBtn.innerText = '▶ Putar Musik';
    }

    renderPlaylist();

    /* ==========================================
       3. BUKU CATATAN SISWA (LOCAL STORAGE)
       ========================================== */
    const studentNotes = document.getElementById('studentNotes');
    const saveStatus = document.getElementById('saveStatus');

    if (localStorage.getItem('student_study_notes')) {
      studentNotes.value = localStorage.getItem('student_study_notes');
    }

    function saveNotes() {
      localStorage.setItem('student_study_notes', studentNotes.value);
      saveStatus.innerText = 'Tersimpan otomatis!';
      setTimeout(() => {
        saveStatus.innerText = 'Tersimpan otomatis di browser';
      }, 1500);
    }

    function clearNotes() {
      if (confirm('Yakin ingin menghapus semua catatan?')) {
        studentNotes.value = '';
        localStorage.removeItem('student_study_notes');
        saveStatus.innerText = 'Catatan dikosongkan';
      }
    }
  </script>
</body>
</html>
