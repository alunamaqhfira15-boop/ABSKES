<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAKON - Laporan Absensi dan Keaktifan Online Negeri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                        }
                    }
                }
            }
        }
    </script>
    <!-- SheetJS (Library Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- ========================================== -->
    <!-- 1. HALAMAN WELCOME / LOGIN GURU            -->
    <!-- ========================================== -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-8 shadow-2xl border border-white/20 backdrop-blur-md">
            
            <div class="text-center space-y-3 mb-6">
                <div class="inline-flex p-4 rounded-2xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 mb-1 shadow-inner">
                    <i data-lucide="clipboard-check" class="w-10 h-10"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Selamat Datang di <span class="text-emerald-600 dark:text-emerald-400">LAKON</span></h1>
                <p class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 tracking-wider uppercase">Laporan Absensi dan Keaktifan Online Negeri</p>
                <p class="text-sm text-slate-500 dark:text-slate-400">Silakan masukkan identitas guru pengajar untuk memulai absensi kelas.</p>
            </div>

            <!-- Form Identitas Guru -->
            <form onsubmit="handleTeacherLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Nama Guru / Pengajar <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i data-lucide="user-check" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="teacherNameInput" required placeholder="Contoh: Pak Budi, S.Pd." class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">NIP / NIK Guru <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i data-lucide="id-card" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="teacherNipInput" required placeholder="Contoh: 19850101 201001 1 001" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 hover:shadow-emerald-600/40 transition-all flex items-center justify-center gap-2 text-sm mt-2">
                    Masuk ke LAKON <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-xs text-slate-400">Sistem Absensi Kelas Digital Versi 2.0</p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. APLIKASI UTAMA                          -->
    <!-- ========================================== -->
    <div id="mainApp" class="hidden">
        
        <!-- NAVIGATION BAR -->
        <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-3">
                        <div class="bg-gradient-to-tr from-emerald-600 to-teal-500 p-2.5 rounded-xl text-white shadow-md shadow-emerald-500/20">
                            <i data-lucide="clipboard-check" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                                LAKON
                            </h1>
                            <p class="text-xs text-emerald-600 dark:text-emerald-400 font-medium flex items-center gap-1">
                                <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
                                <span id="displayTeacherInfo">Guru: -</span>
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 sm:space-x-3">
                        <!-- Class Selector -->
                        <div class="relative">
                            <select id="classSelector" onchange="changeActiveClass()" class="bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 text-sm font-semibold rounded-lg pl-9 pr-8 py-2 border-0 focus:ring-2 focus:ring-emerald-500 cursor-pointer appearance-none shadow-inner">
                            </select>
                            <i data-lucide="school" class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400 pointer-events-none"></i>
                            <i data-lucide="chevron-down" class="w-4 h-4 absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400 pointer-events-none"></i>
                        </div>

                        <button onclick="openClassModal()" class="p-2 sm:px-3 sm:py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-1.5 border border-slate-200 dark:border-slate-700">
                            <i data-lucide="folder-cog" class="w-4 h-4 text-emerald-600 dark:text-emerald-400"></i>
                            <span class="hidden md:inline">Kelas</span>
                        </button>

                        <button onclick="openStudentModal()" class="p-2 sm:px-3 sm:py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-1.5 border border-slate-200 dark:border-slate-700">
                            <i data-lucide="
