<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Lounge - Multi-Genre Playlist, Timer & Notes</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --accent-cyan: #38bdf8;
      --accent-yellow: #facc15;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .title-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .title-section h1 {
      font-size: 2rem;
      background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .title-section p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    /* Timer Styles */
    .timer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: 3.2rem;
      font-weight: 700;
      margin: 10px 0;
      font-family: monospace;
      color: var(--accent-cyan);
    }

    .timer-settings {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .timer-settings input {
      width: 70px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(0,0,0,0.3);
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-purple);
    }

    .btn-active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    }

    /* Genre & Music Player Styles */
    .music-card h2, .notes-card h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--accent-purple);
    }

    .genre-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .genre-btn {
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-sub);
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .genre-btn.active, .genre-btn:hover {
      background: var(--accent-purple);
      color: white;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .track-list::-webkit-scrollbar {
      width: 5px;
    }

    .track-list::-webkit-scrollbar-thumb {
      background: var(--accent-purple);
      border-radius: 4px;
    }

    .track-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .track-item:hover {
      border-color: var(--accent-purple);
    }

    .track-item.playing {
      background: rgba(192, 132, 252, 0.25);
      border-color: var(--accent-pink);
    }

    .playing-indicator {
      font-size: 0.8rem;
      color: var(--accent-pink);
      font-weight: bold;
    }

    /* Notes Styles */
    .notes-card {
      grid-column: 1 / -1;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: white;
      resize: vertical;
      font-size: 0.95rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-purple);
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      color: var(--text-sub);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="title-section">
    <h1>🎧 Study Lounge Multi-Genre & Playlist</h1>
    <p>Atur timer belajarmu, pilih genre & lagu favoritmu, dan catat materi penting!</p>
  </div>

  <div class="app-container">
    
    <!-- 1. POMODORO TIMER DENGAN CUSTOM WAKTU -->
    <div class="glass-card timer-card">
      <div style="font-size:0.9rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent-pink); font-weight:bold;" id="timerLabel">Sesi Fokus</div>
      
      <div class="timer-display" id="timeDisplay">25:00</div>

      <div class="timer-settings">
        <input type="number" id="customMinutes" value="25" min="1" max="120" title="Ubah Menit">
        <button class="btn" onclick="setCustomTimer()">Atur Waktu</button>
      </div>

      <div class="btn-group">
        <button class="btn btn-active" id="startTimerBtn" onclick="toggleTimer()">Mulai</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- 2. PEMUTAR LAGU DENGAN KATEGORI GENRE & PILIHAN LAGU -->
    <div class="glass-card music-card">
      <h2>🎵 Pilihan Genre & Lagu</h2>
      
      <!-- Tombol Kategori Genre -->
      <div class="genre-tabs" id="genreTabs">
        <!-- Generat via JS -->
      </div>

      <!-- Daftar Lagu Sesuai Genre yang Dipilih -->
      <div class="track-list" id="trackList">
        <!-- List lagu diisi via JS -->
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn" id="playMusicBtn" onclick="togglePlayMusic()">▶ Putar Musik</button>
        <button class="btn" onclick="stopMusic()">⏹ Berhenti</button>
      </div>
    </div>

    <!-- 3. BUKU CATATAN SISWA (STUDY NOTES) -->
    <div class="glass-card notes-card">
      <h2>📝 Buku Catatan Tugas & Pelajaran</h2>
      <textarea id="studentNotes" placeholder="Tulis catatan, rangkuman, atau daftar tugas sekolahmu di sini..." oninput="saveNotes()"></textarea>
      <div class="note-footer">
        <span id="saveStatus">Tersimpan otomatis di browser</span>
        <button class="btn" onclick="clearNotes()" style="padding: 4px 10px; font-size: 0.8rem;">Hapus Catatan</button>
      </div>
    </div>

  </div>

  <script>
    /* ==========================================
       1. POMODORO TIMER LOGIC
       ========================================== */
    let timerSeconds = 25 * 60;
    let isRunning = false;
    let timerInterval = null;

    const timeDisplay = document.getElementById('timeDisplay');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const customMinutesInput = document.getElementById('customMinutes');

    function updateDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function setCustomTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startTimerBtn.innerText = 'Mulai';
      const userMins = parseInt(customMinutesInput.value);
      if (userMins > 0) {
        timerSeconds = userMins * 60;
        updateDisplay();
      }
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startTimerBtn.innerText = 'Lanjut';
      } else {
        isRunning = true;
        startTimerBtn.innerText = 'Jeda';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startTimerBtn.innerText = 'Mulai';
            alert('Waktu belajar selesai! Waktunya istirahat sejenak. 🎉');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startTimerBtn.innerText = 'Mulai';
      setCustomTimer();
    }

    /* ==========================================
       2. DATABASE LAGU PER GENRE
       ========================================== */
    const songsData = {
      POP: [
        { title: "Teh Hijau", src: "https://youtu.be/RO75uUZiAw0?si=Y5bnAaAHG6gKMcGy" },
        { title: "Sesi Potret", src: "https://youtu.be/Nskf70DMR60?si=7gusnYtg8Nph1hWP" },
        { title: "Dunia Yang Nanti", src: "https://youtu.be/awWKxGftWh4?si=ADgu680HmAlumafq" },
        { title: "IQRO", src: "https://youtu.be/9WHWkEJLKJM?si=xE8d4we13dNQhgev" },
        { title: "Ini Abadi", src: "https://youtu.be/qQDaxjLReck?si=F0kQ16j-Q1FLp_w2" },
        { title: "Bergema Sampai Selamanya", src: "https://youtu.be/g0c7FeMn5lE?si=NIOLP8KEWxUvbMzM" },
        { title: "Dan", src: "https://youtu.be/fDkI5BvWQU8?si=5M2hMzuHfVGVNx02" },
        { title: "Jatuh Suka", src: "https://youtu.be/2uJut6USftQ?si=-jCcO3hm-hxyctiT" }
      ],
      DANGDUT: [
        { title: "Dirantai Digelang Rindu", src: "https://youtu.be/rCJwHEf6UjY?si=F25nRdL4Dk9M6Ef6" },
        { title: "Mimpi Manis", src: "https://youtu.be/-QfSwSM1F-c?si=yh_X5Noz-mYhNbtD" },
        { title: "Kucing Garong", src: "https://youtu.be/WqX7CUmf3t8?si=4LPrdKlcocCPDvkZ" },
        { title: "Angel 2", src: "https://youtu.be/1WeCPL58Ijg?si=yxwt8keG_JJlxdU9" }
      ],
      "HIP HOP": [
        { title: "Lo-Fi Boom Bap Beat", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
        { title: "Midnight Chillhop Groove", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
        { title: "Study Lofi Hip Hop", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" }
      ],
      REGGAE: [
        { title: "Island Beach Vibe Reggae", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" },
        { title: "Sunny Jam Reggae", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" },
        { title: "Roots Reggae Relax", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" }
      ],
      ROCK: [
        { title: "Soft Classic Rock Ballad", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { title: "Energetic Guitar Riff", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3" },
        { title: "Indie Rock Ambient", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3" }
      ],
      KLASIK: [
        { title: "Mozart Calm Piano & Strings", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
        { title: "Beethoven Moonlight Vibe", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" },
        { title: "Chopin Soft Nocturne", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3" }
      ]
    };

    let selectedGenre = "POP";
    let currentPlayingTrack = null;
    let audioElement = new Audio();
    audioElement.loop = true;
    let isMusicPlaying = false;

    const genreTabsEl = document.getElementById('genreTabs');
    const trackListEl = document.getElementById('trackList');
    const playMusicBtn = document.getElementById('playMusicBtn');

    // Tampilkan Tab Genre
    function renderGenreTabs() {
      genreTabsEl.innerHTML = '';
      Object.keys(songsData).forEach(genre => {
        const btn = document.createElement('button');
        btn.className = `genre-btn ${genre === selectedGenre ? 'active' : ''}`;
        btn.innerText = genre;
        btn.onclick = () => {
          selectedGenre = genre;
          renderGenreTabs();
          renderTrackList();
        };
        genreTabsEl.appendChild(btn);
      });
    }

    // Tampilkan Daftar Lagu berdasarkan Genre
    function renderTrackList() {
      trackListEl.innerHTML = '';
      const songs = songsData[selectedGenre];

      songs.forEach((song) => {
        const isThisPlaying = currentPlayingTrack && currentPlayingTrack.src === song.src && isMusicPlaying;
        const item = document.createElement('div');
        item.className = `track-item ${isThisPlaying ? 'playing' : ''}`;
        item.innerHTML = `
          <span>🎵 ${song.title}</span>
          ${isThisPlaying ? '<span class="playing-indicator">🔊 Diputar</span>' : ''}
        `;
        item.onclick = () => playSong(song);
        trackListEl.appendChild(item);
      });
    }

    function playSong(song) {
      if (currentPlayingTrack && currentPlayingTrack.src === song.src) {
        togglePlayMusic();
        return;
      }
      currentPlayingTrack = song;
      audioElement.src = song.src;
      audioElement.play();
      isMusicPlaying = true;
      playMusicBtn.innerText = '⏸ Jeda Musik';
      renderTrackList();
    }

    function togglePlayMusic() {
      if (!currentPlayingTrack) {
        // Jika belum ada lagu yang dipilih, putar lagu pertama di genre saat ini
        playSong(songsData[selectedGenre][0]);
        return;
      }
      if (isMusicPlaying) {
        audioElement.pause();
        isMusicPlaying = false;
        playMusicBtn.innerText = '▶ Putar Musik';
      } else {
        audioElement.play();
        isMusicPlaying = true;
        playMusicBtn.innerText = '⏸ Jeda Musik';
      }
      renderTrackList();
    }

    function stopMusic() {
      audioElement.pause();
      audioElement.currentTime = 0;
      isMusicPlaying = false;
      currentPlayingTrack = null;
      playMusicBtn.innerText = '▶ Putar Musik';
      renderTrackList();
    }

    renderGenreTabs();
    renderTrackList();

    /* ==========================================
       3. BUKU CATATAN SISWA (LOCAL STORAGE)
       ========================================== */
    const studentNotes = document.getElementById('studentNotes');
    const saveStatus = document.getElementById('saveStatus');

    if (localStorage.getItem('student_study_notes')) {
      studentNotes.value = localStorage.getItem('student_study_notes');
    }

    function saveNotes() {
      localStorage.setItem('student_study_notes', studentNotes.value);
      saveStatus.innerText = 'Tersimpan otomatis!';
      setTimeout(() => {
        saveStatus.innerText = 'Tersimpan otomatis di browser';
      }, 1500);
    }

    function clearNotes() {
      if (confirm('Yakin ingin menghapus semua catatan?')) {
        studentNotes.value = '';
        localStorage.removeItem('student_study_notes');
        saveStatus.innerText = 'Catatan dikosongkan';
      }
    }
  </script>
</body>
</html>
